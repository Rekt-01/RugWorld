<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zelda-Style Overworld Hub</title>
    <style>
        body {
            margin: 0;
            background-color: #0b131f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents unwanted zooming/scrolling on mobile */
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            image-rendering: pixelated;
            border: 3px solid #333;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
        #instructions {
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 8px;
            border: 1px solid #555;
        }
        /* On-screen mobile controls layout */
        #mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            gap: 5px;
        }
        .control-row {
            display: flex;
            gap: 5px;
        }
        .ctrl-btn {
            width: 60px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="instructions">
        <b>RugWorld Hub</b> — Use WASD/Arrows (PC) or On-Screen Buttons (Mobile)
    </div>

    <!-- Mobile Touch Control Pad -->
    <div id="mobile-controls">
        <button class="ctrl-btn" id="btn-up">⬆️</button>
        <div class="control-row">
            <button class="ctrl-btn" id="btn-left">⬅️</button>
            <button class="ctrl-btn" id="btn-down">⬇️</button>
            <button class="ctrl-btn" id="btn-right">➡️</button>
        </div>
    </div>

    <script type="module">
        import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";

        kaboom({
            width: 768,
            height: 460, // Slightly shorter to fit mobile buttons comfortably on screen
            scale: 1,
            background: [34, 139, 34],
        });

        // --- WORLD BOUNDARIES ---
        const WALL_COLOR = [20, 90, 20];
        add([rect(768, 20), color(WALL_COLOR), pos(0, 0), area(), body({ isStatic: true })]);
        add([rect(768, 20), color(WALL_COLOR), pos(0, 440), area(), body({ isStatic: true })]);
        add([rect(20, 460), color(WALL_COLOR), pos(0, 0), area(), body({ isStatic: true })]);
        add([rect(20, 460), color(WALL_COLOR), pos(748, 0), area(), body({ isStatic: true })]);

        // --- BUILDINGS & DOORS ---
        // Mapping to the html files you already created!
        const buildings = [
            { x: 80, y: 80, color: [139, 69, 19], name: "Shop", url: "shop.html" },
            { x: 240, y: 80, color: [110, 110, 130], name: "Arcade", url: "arcade.html" },
            { x: 400, y: 80, color: [160, 82, 45], name: "Casino", url: "casino.html" },
            { x: 560, y: 80, color: [90, 50, 120], name: "OpenSea", url: "Opensea.html" }
        ];

        buildings.forEach(b => {
            // Building body
            add([rect(110, 80), color(b.color), pos(b.x, b.y), area(), body({ isStatic: true })]);
            // Door
            add([rect(24, 18), color(40, 20, 10), pos(b.x + 43, b.y + 62), area(), "door", { targetUrl: b.url }]);
            // Label
            add([text(b.name, { size: 12 }), pos(b.x + 20, b.y - 18)]);
        });

        // --- PLAYER CHARACTER ---
        const player = add([
            rect(24, 28),
            color(220, 40, 40),
            pos(372, 320),
            area(),
            body(),
            "player",
        ]);

        const SPEED = 180;

        // Direction flags for multi-platform support
        let moveLeft = false;
        let moveRight = false;
        let moveUp = false;
        let moveDown = false;

        // --- KEYBOARD LISTENERS (PC) ---
        onKeyDown("left", () => { player.move(-SPEED, 0); });
        onKeyDown("right", () => { player.move(SPEED, 0); });
        onKeyDown("up", () => { player.move(0, -SPEED); });
        onKeyDown("down", () => { player.move(0, SPEED); });

        onKeyDown("a", () => { player.move(-SPEED, 0); });
        onKeyDown("d", () => { player.move(SPEED, 0); });
        onKeyDown("w", () => { player.move(0, -SPEED); });
        onKeyDown("s", () => { player.move(0, SPEED); });

        // --- TOUCH BUTTON LISTENERS (Mobile) ---
        function bindTouchButton(id, direction) {
            const btn = document.getElementById(id);
            if (!btn) return;
            
            const pressOn = (e) => { e.preventDefault(); if(direction === 'left') moveLeft = true; if(direction === 'right') moveRight = true; if(direction === 'up') moveUp = true; if(direction === 'down') moveDown = true; };
            const pressOff = (e) => { e.preventDefault(); if(direction === 'left') moveLeft = false; if(direction === 'right') moveRight = false; if(direction === 'up') moveUp = false; if(direction === 'down') moveDown = false; };

            btn.addEventListener("touchstart", pressOn, { passive: false });
            btn.addEventListener("touchend", pressOff, { passive: false });
            btn.addEventListener("mousedown", pressOn);
            btn.addEventListener("mouseup", pressOff);
        }

        bindTouchButton("btn-up", "up");
        bindTouchButton("btn-down", "down");
        bindTouchButton("btn-left", "left");
        bindTouchButton("btn-right", "right");

        // Frame loop handler for smooth mobile button holding
        onUpdate(() => {
            if (moveLeft) player.move(-SPEED, 0);
            if (moveRight) player.move(SPEED, 0);
            if (moveUp) player.move(0, -SPEED);
            if (moveDown) player.move(0, -SPEED === 0 ? SPEED : SPEED); // fallback
            if (moveDown) player.move(0, SPEED);
        });

        // --- DOOR COLLISION REDIRECT ---
        player.onCollide("door", (door) => {
            window.location.href = door.targetUrl;
        });
    </script>
</body>
</html>
